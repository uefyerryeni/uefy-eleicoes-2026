name: Atualizar Radar RN

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radar-rn.yml'
      - 'scripts/build_radar_rn.py'
  schedule:
    - cron: '*/5 20-23 4 10 *'\n    - cron: '*/5 0-5 5 10 *'

permissions:
  contents: write

concurrency:
  group: radar-rn-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar snapshot oficial do Radar RN
        run: python scripts/build_radar_rn.py

      - name: Validar JSON gerado
        run: python -m json.tool data/radar-rn.json > /dev/null

      - name: Auditoria de integridade antes de publicar
        run: python scripts/qa_static.py

      - name: Publicar somente se os dados mudaram
        run: |
          if git diff --quiet -- data/radar-rn.json; then
            echo "Sem alterações no snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-rn.json
          git commit -m "dados: atualizar Radar RN"
          git pull --rebase origin main
          git push
