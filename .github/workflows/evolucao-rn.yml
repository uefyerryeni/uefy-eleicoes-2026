name: Evolucao RN
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * 4 10 *'
    - cron: '*/5 0-5 5 10 *'
  push:
    paths:
      - 'scripts/build_evolucao_rn.py'
      - '.github/workflows/evolucao-rn.yml'
permissions:
  contents: write
concurrency:
  group: evolucao-rn
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gerar historico
        run: python scripts/build_evolucao_rn.py
      - name: Validar
        run: |
          if [ -f data/evolucao-rn.json ]; then python -m json.tool data/evolucao-rn.json > /dev/null; fi
      - name: Salvar
        run: |
          if [ ! -f data/evolucao-rn.json ]; then exit 0; fi
          if [ -z "$(git status --porcelain -- data/evolucao-rn.json)" ]; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/evolucao-rn.json
          git commit -m "dados evolucao"
          git pull --rebase origin main
          git push
