name: Atualizar candidaturas RJ e SP
on:
  push:
    paths:
      - "scripts/build_large_ufs.py"
      - ".github/workflows/candidatos-large.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar base RJ e SP
        run: python scripts/build_large_ufs.py
      - name: Publicar base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos-ufs-d.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza candidaturas RJ e SP"
            git push
          fi
