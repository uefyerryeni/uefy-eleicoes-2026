name: Atualizar candidaturas oficiais TSE
on:
  workflow_dispatch:
  schedule:
    - cron: "20 0,6,12,18 * * *"
  push:
    paths:
      - "scripts/build_large_ufs.py"
      - ".github/workflows/candidatos-large.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar bases oficiais de candidaturas
        run: python scripts/build_large_ufs.py
      - name: Validar arquivos
        run: |
          python - <<'PY'
          import json, pathlib
          files=["data/candidatos-2026.json"]+[f"data/candidatos-ufs-{x}.json" for x in "abcd"]
          for f in files:
              d=json.loads(pathlib.Path(f).read_text(encoding="utf-8"))
              assert d, f"{f} vazio"
          assert len(json.loads(pathlib.Path("data/candidatos-2026.json").read_text())["pres"])>0
          print("Bases validadas")
          PY
      - name: Auditoria de integridade antes de publicar
        run: python scripts/qa_static.py

      - name: Publicar bases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos-2026.json data/candidatos-ufs-a.json data/candidatos-ufs-b.json data/candidatos-ufs-c.json data/candidatos-ufs-d.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza candidaturas pela base oficial do TSE"
            git pull --rebase origin main
          git push
          fi
