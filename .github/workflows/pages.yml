name: Deploy UEFY Eleições to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    name: Homologação automatizada
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: QA estático e integridade dos dados
        run: python scripts/qa_static.py

      - name: Sintaxe JavaScript
        run: node --test tests/estatistica-core.test.cjs tests/publicacao-core.test.cjs && node --check plataforma.js && node --check publicacao-core.js && node --check live-studio.js && node --check video.js && node --check share-mobile.js && node --check election-integrity.js && node --check app-primeiro-turno.js && node --check app.js && node --check rn.js && node --check radar.js && node --check analises.js && node --check entre-turnos.js && node --check mudancas-rn.js

      - name: Identificar atualização exclusivamente de dados
        id: update_class
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          subject="$(git log -1 --format=%s)"
          if [[ -n "$changed" ]] && [[ "$subject" == dados:* ]] && ! grep -qvE '^data/(rn-governador-mapa-2t|entre-turnos-2t)\.json$' <<< "$changed"; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot de dados auditado, sem mudanças de código."
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "Mudança de código: teste completo obrigatório."
          fi

      - name: Instalar testes de navegador
        if: steps.update_class.outputs.data_only != 'true'
        run: npm install

      - name: Instalar Chromium
        if: steps.update_class.outputs.data_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Testar Central, mapas e publicações
        if: steps.update_class.outputs.data_only != 'true'
        run: npx playwright test

      - name: Salvar relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
