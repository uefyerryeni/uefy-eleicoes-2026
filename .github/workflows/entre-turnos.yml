name: Preparar indicadores entre turnos do RN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_entre_turnos.py'
      - '.github/workflows/entre-turnos.yml'
  schedule:
    - cron: '*/10 20-23 25 10 *'
    - cron: '*/10 0-6 26 10 *'
    - cron: '30 10 27-31 10 *'
permissions:
  contents: write
  actions: write
concurrency:
  group: uefy-entre-turnos
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coletar indicadores oficiais por município
        run: python3 scripts/build_entre_turnos.py
      - name: Verificar JSON e integridade
        run: |
          python3 -m json.tool data/entre-turnos-2t.json > /dev/null
          python3 scripts/qa_static.py
      - name: Salvar apenas quando houver alterações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/entre-turnos-2t.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entre-turnos-2t.json
          git commit -m "dados: indicadores oficiais do segundo turno"
          git pull --rebase origin main
          git push
          gh workflow run pages.yml --ref main
